name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create a GitHub Release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Design-token guard (no hard-coded styles in screens)
        run: bash scripts/check-design-tokens.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21" # Robolectric (screenshot tests) needs 21 for recent Android versions

      # No Gradle wrapper binary is committed; CI installs this exact Gradle version.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      # Unit tests + screenshot tests. app/src/test/screenshots/MODE says whether to record new
      # reference images or verify against the committed ones (any pixel difference fails).
      - name: Unit + screenshot tests
        run: |
          MODE=$(tr -d '[:space:]' < app/src/test/screenshots/MODE 2>/dev/null || echo record)
          echo "Screenshot mode: $MODE"
          gradle --no-daemon --stacktrace "${MODE}RoborazziDebug"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            app/src/test/screenshots/*.png
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing — refusing to build an unsigned APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify signature (same key every build)
        run: |
          set -o pipefail
          rm -f "$RUNNER_TEMP/release.p12"
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apksigner from $BT"
          # Fails the build if the APK is not properly signed. The certificate digest printed
          # here is public and must be identical on every build (same key = updates install over).
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "TransfusionVS-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: TransfusionVS-${{ github.run_number }}
          path: TransfusionVS-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: room-schemas-${{ github.run_number }}
          path: app/schemas
          if-no-files-found: ignore

      - name: GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" TransfusionVS-*.apk \
            --title "Transfusion VS ${{ github.ref_name }}" \
            --notes "Download the .apk below on your phone and install it. See README for the Arabic steps."
