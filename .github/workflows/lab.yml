name: Lab

# The test lab of docs/TEST_LOOP.md: real emulators, real alarms, no phone needed.
# main must stay untouched until the stop condition, and workflow_dispatch only works for files on
# the default branch, so the lab runs on pushes to this branch whose commit message has [lab].
# What to run is in lab/config.json (fast loop: api 34 only; full matrix every 3rd iteration).

on:
  push:
    branches: [design-overhaul]

permissions:
  contents: read

jobs:
  config:
    if: contains(github.event.head_commit.message, '[lab]')
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.read.outputs.apis }}
      only: ${{ steps.read.outputs.only }}
      robustness: ${{ steps.read.outputs.robustness }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          echo "apis=$(jq -c .apis lab/config.json)" >> "$GITHUB_OUTPUT"
          echo "only=$(jq -r .only lab/config.json)" >> "$GITHUB_OUTPUT"
          echo "robustness=$(jq -r .robustness lab/config.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Build debug, test and non-debuggable APKs
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest assembleLab
      - name: Unit, property and migration tests (results are read from the XML)
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest --continue
      - name: Android lint
        continue-on-error: true
        run: gradle --no-daemon lintDebug --continue
      - name: ktlint
        continue-on-error: true
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          ./ktlint "app/src/main/**/*.kt" --reporter=plain?group_by_file > ktlint.txt 2>&1
          tail -5 ktlint.txt
      - name: Collect
        if: always()
        run: |
          mkdir -p gates
          cp -r app/build/test-results/testDebugUnitTest gates/unit 2>/dev/null || true
          cp app/build/reports/lint-results-debug.txt gates/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.xml gates/ 2>/dev/null || true
          cp ktlint.txt gates/ 2>/dev/null || true
          cp -r app/build/audit gates/audit 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/lab/app-lab.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gates
          path: gates/

  emulator:
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJson(needs.config.outputs.apis) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the lab on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash lab/run_lab.sh ${{ matrix.api }} "${{ needs.config.outputs.only }}" "${{ needs.config.outputs.robustness }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-api${{ matrix.api }}
          path: lab-results/
          if-no-files-found: warn
