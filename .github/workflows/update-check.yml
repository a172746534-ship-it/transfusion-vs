name: Update check

# docs/CUSTOM_TIMER.md §9: the PUBLISHED release installed over v0.5.0 on an emulator, with a running
# transfusion and turning plan; both keep running and their alarms still fire (lab/update_check.py).
# Runs on a push to this branch whose commit message has [update-check].

on:
  push:
    branches: [custom-timer]

permissions:
  contents: read

jobs:
  update:
    if: contains(github.event.head_commit.message, '[update-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir old
          gh release download v0.6.0 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir new
          ls -l old new
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: python3 lab/update_check.py --old "$(ls old/*.apk)" --new "$(ls new/*.apk)" --out update-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: update-check
          path: update-results/
          if-no-files-found: warn
